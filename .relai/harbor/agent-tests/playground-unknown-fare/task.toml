artifacts = ["/logs/agent/trajectory.json"]
schema_version = "1.4"

[agent]
timeout_sec = 180.0

[task]
description = "Synthetic unknown-fare baseline on the current optimized checkpoint, without defect injection."
name = "relai/task-candidate"
version = "0.1.0"

[[task.authors]]
email = "engineering@relai.ai"
name = "RELAI"

[verifier]
environment_mode = "separate"
timeout_sec = 120.0

[metadata.relai]
schema_version = "1"
kind = "learning_environment"
id = "playground-unknown-fare"
name = "playground-unknown-fare"
description = "Evaluate unknown baggage policy handling for Flex Saver Plus against challenge-unknown-fare."
tags = ["unknown-fare", "synthetic", "new-requirement", "baseline"]
agent_target = "SkyServe Airline Support"
target_type = "agent"
input_type = "fixed"
input_asset = "environment/scenario.json"
mock_targets = []
mock_assets = []
evaluators = [{ id = "verify-unknown-fare-fallback", type = "code", path = "tests/evaluate.py", min_score = 0.0, max_score = 1.0 }, { id = "judge-unknown-fare", type = "llm_judge", path = "tests/evaluator.toml", min_score = 0.0, max_score = 1.0 }]
