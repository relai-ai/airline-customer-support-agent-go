artifacts = ["/logs/agent/trajectory.json"]
schema_version = "1.4"

[agent]
timeout_sec = 180.0

[task]
description = "Exact disclosed synthetic nonretryable booking-outage baseline; a passing result is resilience evidence."
name = "relai/task-candidate"
version = "0.1.0"

[[task.authors]]
email = "engineering@relai.ai"
name = "RELAI"

[verifier]
environment_mode = "separate"
timeout_sec = 120.0

[metadata.relai]
schema_version = "1"
kind = "learning_environment"
id = "playground-booking-outage"
name = "playground-booking-outage"
description = "Honest handling of a deliberately injected synthetic booking lookup outage, not a real upstream incident."
tags = ["booking-outage", "synthetic", "controlled-tool-failure", "baseline"]
agent_target = "SkyServe Airline Support"
target_type = "component"
component_id = "skyserve-support-turn"
target_import_path = "github.com/relai-ai/airline-customer-support-agent-go/airline.Agent.StreamResponse"
input_type = "component_fixed"
input_asset = "environment/scenario.json"
component_adapter_asset = "environment/fixture-command.json"
mock_targets = []
mock_assets = []
evaluators = [{ id = "verify-outage-fixture", type = "code", path = "tests/evaluate.py", min_score = 0.0, max_score = 1.0 }, { id = "judge-outage-handling", type = "llm_judge", path = "tests/evaluator.toml", min_score = 0.0, max_score = 1.0 }]
