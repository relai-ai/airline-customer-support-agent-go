artifacts = ["/logs/agent/trajectory.json"]
schema_version = "1.4"

[agent]
timeout_sec = 180.0

[task]
description = "Two-turn off-topic refusal, airline redirection, and policy-grounded baggage recovery."
name = "relai/task-candidate"
version = "0.1.0"

[[task.authors]]
email = "engineering@relai.ai"
name = "RELAI"

[verifier]
environment_mode = "separate"
timeout_sec = 120.0

[metadata.relai]
schema_version = "1"
kind = "learning_environment"
id = "airline-off-topic-refusal"
name = "airline-off-topic-refusal"
description = "Refuse the observed cookie recipe request, redirect briefly, then resume useful standard-ticket baggage assistance."
tags = ["airline", "off-topic", "multi-turn", "onboarding"]
agent_target = "SkyServe Airline Support"
target_type = "agent"
input_type = "fixed"
input_asset = "environment/scenario.json"
mock_targets = []
mock_assets = []
evaluators = [{ id = "judge-refusal", type = "llm_judge", path = "tests/evaluator.toml", min_score = 0.0, max_score = 1.0 }, { id = "judge-redirection", type = "llm_judge", path = "tests/redirection/evaluator.toml", min_score = 0.0, max_score = 1.0 }, { id = "judge-airline-helpfulness", type = "llm_judge", path = "tests/helpfulness/evaluator.toml", min_score = 0.0, max_score = 1.0 }]
